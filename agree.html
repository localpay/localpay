  <!-- React-JSX Script 영역 -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    // ==========================================

    const Icons = {

        </svg>
      ),
      Copy: () => (
        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
      ),
      Database: () => (
        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
          <ellipse cx="12" cy="5" rx="9" ry="3" />
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
          <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3" />
        </svg>
      )
    };

    // ==========================================
    // 2. CONSTANTS & PRESETS
    // ==========================================
    const PRESETS = [
      {
        name: "SW 고도화 사업 (대기업 참여제한 예외)",
        contractType: "sw",
        governingLaw: "national",
        estimatedPrice: 480000000,
        isUrgent: false,
        isSingleSource: false,
        hasPatent: false,
        isLinkedProject: true,
        policyTarget: "none",
        isRebid: false,
        institutionType: "national",
        techImportance: 5,
        isSpecFixed: false,
        companyName: "아이티솔루션 주식회사"
      },
      {
        name: "화폐박물관 안전 펜스 보강 공사 (국가계약법 준용)",
        contractType: "construction",
        governingLaw: "national",
        estimatedPrice: 48000000,
        isUrgent: true,
        isSingleSource: false,
        hasPatent: false,
        isLinkedProject: false,
        policyTarget: "none",
        isRebid: false,
        institutionType: "public_corp",
        techImportance: 2,
        isSpecFixed: true,
        companyName: "대한안전시설(주)"
      },
      {
        name: "특허 기술 포함 장비 구매 (단독공급 수의)",
        contractType: "goods",
        governingLaw: "national",
        estimatedPrice: 150000000,
        isUrgent: false,
        isSingleSource: true,
        hasPatent: true,
        isLinkedProject: false,
        policyTarget: "innovation",
        isRebid: false,
        institutionType: "public_corp",
        techImportance: 4,
        isSpecFixed: true,
        companyName: "특허테크산업"
      }
    ];

    // ==========================================
    // 2-1. NATIONAL CONTRACT LAW BASIS DB
    // 첨부 법령 PDF 기준: 국가계약법·시행령·시행규칙·물품구매(제조)계약일반조건
    // ==========================================
    const LAW_BASIS = {
      principle: {
        title: "계약방법 원칙",
        article: "국가계약법 제7조 제1항",
        summary: "계약은 일반경쟁이 원칙이며, 목적·성질·규모상 필요한 경우에 한해 제한경쟁·지명경쟁·수의계약 검토"
      },
      notice: {
        title: "입찰공고",
        article: "국가계약법 제8조, 국가계약법 시행령 제33조·제35조",
        summary: "경쟁입찰 시 입찰에 관한 사항을 공고 또는 통지하고, 긴급·재공고 등 예외 사유별 공고기간 단축 가능성 검토"
      },
      estimate: {
        title: "예정가격",
        article: "국가계약법 제8조의2, 국가계약법 시행령 제7조·제8조·제9조, 시행규칙 제4조~제11조",
        summary: "추정가격 산정, 예정가격 작성, 거래실례가격·원가계산·표준시장단가·견적가격 등 결정기준 반영"
      },
      method: {
        title: "계약방법",
        article: "국가계약법 시행령 제10조~제26조",
        summary: "경쟁입찰 성립, 참가자격, 제한경쟁, 지명경쟁, 수의계약 사유 검토"
      },
      negotiation: {
        title: "협상에 의한 계약",
        article: "국가계약법 시행령 제43조",
        summary: "전문성·기술성·창의성 등이 필요한 물품·용역의 경우 제안서 평가 기반 협상 방식 검토"
      },
      privateContract: {
        title: "수의계약",
        article: "국가계약법 시행령 제26조",
        summary: "재공고 유찰, 특정인의 기술·용역·생산, 소액계약, 정책구매 대상 등 수의계약 가능 사유 검토"
      },
      delay: {
        title: "지체상금",
        article: "국가계약법 시행령 제74조, 국가계약법 시행규칙 제75조",
        summary: "계약금액에서 기납·기성 부분을 공제한 금액에 지체상금률과 지체일수를 곱하여 산정"
      },
      goodsTerms: {
        title: "물품구매 계약문서 및 이행",
        article: "물품구매(제조)계약일반조건 제1조~제3조, 제5조, 제7조~제8조",
        summary: "계약문서, 통지 효력, 계약보증금 납부·국고귀속 등 물품구매 계약 일반조건 반영"
      }
    };

    // ==========================================
    // 3. MAIN COMPONENT
    // ==========================================
    function App() {
      const [contractType, setContractType] = useState('goods');
      const [governingLaw, setGoverningLaw] = useState('national');
      const [estimatedPrice, setEstimatedPrice] = useState(100000000);
      const [isUrgent, setIsUrgent] = useState(false);
      const [isSingleSource, setIsSingleSource] = useState(false);
      const [hasPatent, setHasPatent] = useState(false);
      const [isLinkedProject, setIsLinkedProject] = useState(false);
      const [policyTarget, setPolicyTarget] = useState('none');
      const [isRebid, setIsRebid] = useState(false);
      const [institutionType, setInstitutionType] = useState('national');
      const [techImportance, setTechImportance] = useState(4);
      const [isSpecFixed, setIsSpecFixed] = useState(false);
      const [companyName, setCompanyName] = useState('주식회사 에이비씨');

      // 지체상금 날짜 선택 계산 옵션
      const [isDateCalc, setIsDateCalc] = useState(true);
      const [deliveryDueDate, setDeliveryDueDate] = useState('2026-06-01');
      const [actualDeliveryDate, setActualDeliveryDate] = useState('2026-06-16');
      const [delayDays, setDelayDays] = useState(15);
      const [isPartialDelivery, setIsPartialDelivery] = useState(false);
      const [partialAmount, setPartialAmount] = useState(0);

      // 정책구매 구체화 11대 핵심 상태값 매핑
      const [policyStates, setPolicyStates] = useState({
        heavyDisabled: false,  // 중증장애인생산품여부
        disabled: false,       // 장애인기업여부
        patriot: false,        // 보훈기업여부
        social: false,         // 사회적기업여부
        female: false,         // 여성기업여부
        startup: false,        // 창업기업여부
        venture: false,        // 벤처기업여부
        innovation: false,     // 혁신제품보유여부
        excellent: false,      // 우수조달보유여부
        directProd: false,     // 직접생산확인여부
        masReg: false          // MAS등록여부
      });

      // 간트 목표 일자 State
      const [targetDateStr, setTargetDateStr] = useState(() => {
        const today = new Date();
        today.setDate(today.getDate() + 60);
        return today.toISOString().split('T')[0];
      });

      // 탭 전환 State
      const [activeTab, setActiveTab] = useState('recommendation');
      const [copyFeedback, setCopyFeedback] = useState('');
      const [checkedItems, setCheckedItems] = useState({});

      // 날짜 선택 시 지체일수 실시간 역산 반영
      useEffect(() => {
        if (isDateCalc && deliveryDueDate && actualDeliveryDate) {
          const due = new Date(deliveryDueDate);
          const actual = new Date(actualDeliveryDate);
          const diffTime = actual - due;
          const calculatedDays = Math.max(0, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
          setDelayDays(calculatedDays);
        }
      }, [deliveryDueDate, actualDeliveryDate, isDateCalc]);

      const applyPreset = (preset) => {
        setContractType(preset.contractType);
        setGoverningLaw(preset.governingLaw);
        setEstimatedPrice(preset.estimatedPrice);
        setIsUrgent(preset.isUrgent);
        setIsSingleSource(preset.isSingleSource);
        setHasPatent(preset.hasPatent);
        setIsLinkedProject(preset.isLinkedProject);
        setPolicyTarget(preset.policyTarget);
        setIsRebid(preset.isRebid);
        setInstitutionType(preset.institutionType);
        setTechImportance(preset.techImportance);
        setIsSpecFixed(preset.isSpecFixed);
        if (preset.companyName) setCompanyName(preset.companyName);
      };

      // A. 수의계약 한도 및 검증 알고리즘
      const evaluatePrivateContract = () => {
        let limit = 20000000;
        let policyLimit = 50000000;
        
        let isFeasible = false;
        let reason = "수의계약 불가능 요건에 해당합니다. 일반/제한경쟁 검토가 원칙입니다.";
        let applicableArticle = "";
        let riskLevel = "low";
        let riskDetails = [];

        {
          if (isSingleSource) {
            isFeasible = true;
            applicableArticle = "국가계약법 시행령 제26조 제1항 제2호 (단독공급/특정인 기술)";
            reason = "단독공급 증빙이 가능하므로 특정인의 기술·생산이 필요한 경우에 해당하여 수의계약이 가능합니다.";
          } else if (hasPatent) {
            isFeasible = true;
            applicableArticle = "국가계약법 시행령 제26조 제1항 제2호 사목 (특허/실용신안)";
            reason = "해당 사업에 고유 특허권 등 권리자가 존재하며 타사 대체가 불가능함을 입증할 시 수의계약이 가능합니다.";
          } else if (policyTarget === 'female' || policyTarget === 'disabled' || policyTarget === 'social') {
            if (estimatedPrice <= policyLimit) {
              isFeasible = true;
              applicableArticle = "국가계약법 시행령 제26조 제1항 제5호 가목 (여성·장애인·사회적기업 등)";
              reason = "여성기업, 장애인기업, 혹은 요건을 충족한 사회적기업으로서 5천만 원 이하 소액 수의계약 요건을 총족합니다.";
            } else {
              reason = `정책적 배려 대상 기업이나, 추정가격이 5천만 원을 초과(${ (estimatedPrice / 100000000).toFixed(2) }억 원)하여 여성/장애인 소액수의 요건에서 제외됩니다.`;
            }
          } else if (policyTarget === 'innovation' || policyTarget === 'excellent') {
            isFeasible = true;
            applicableArticle = "국가계약법 시행령 제26조 제1항 제3호 (우수/혁신조달물품)";
            reason = "조달청 혁신제품 혹은 우수조달물품으로 지정된 자재·용역에 해당하여 제한 없는 수의계약 검토가 가능합니다.";
          } else if (isRebid) {
            isFeasible = true;
            applicableArticle = "국가계약법 시행령 제26조 제1항 제1호 (재공고 유찰)";
            reason = "2회 이상 정당하게 입찰공고 하였으나 유찰된 경우로서 수의계약 전환 요건을 충족합니다.";
          } else if (estimatedPrice <= limit) {
            isFeasible = true;
            applicableArticle = "국가계약법 시행령 제26조 제1항 제5호 가목 (소액수의)";
            reason = "추정가격이 2천만 원 이하인 일반 소액수의계약 대상에 해당합니다.";
          }
        }

        if (isFeasible) {
          if (estimatedPrice >= 19000000 && estimatedPrice < 20000000 && applicableArticle.includes("소액수의")) {
            riskLevel = "high";
            riskDetails.push("쪼개기 발주 의심: 일반 소액수의 한도(2천만원) 바로 밑돌며, 분할 발주 여부 집중 감사 대상입니다.");
          }
          if (estimatedPrice >= 48000000 && estimatedPrice < 50000000 && applicableArticle.includes("5호")) {
            riskLevel = "high";
            riskDetails.push("특례 소액수의 한도(5천만원) 직전 금액으로, 여성/장애인 지위 남용 또는 위장업체 유무에 대한 특정 감사 가능성이 존재합니다.");
          }
          if (isSingleSource && !hasPatent) {
            riskLevel = "medium";
            riskDetails.push("단독공급 사유서 보강 필요: 제조사 독점권 증빙 외 대체물품 존재 확인 절차(시장조사 보고서)가 미흡하면 감사 시 부적정 지적을 받습니다.");
          }
        }

        return {
          isFeasible,
          status: isFeasible ? (riskLevel === 'high' ? "조건부 가능 (감사주의)" : "가능") : "불가",
          applicableArticle,
          reason,
          riskLevel,
          riskDetails
        };
      };

      const pContractEval = evaluatePrivateContract();

      // B. 낙찰점수 계산 알고리즘
      const computeMethodScores = () => {
        let scores = {
          general: 50,
          restricted: 40,
          negotiation: 30,
          qualification: 40,
          twoStage: 20,
          private: 10
        };

        scores.negotiation += techImportance * 12;
        scores.qualification += (6 - techImportance) * 10;
        scores.general += (6 - techImportance) * 5;

        if (isSingleSource || hasPatent) {
          scores.private += 80;
          scores.general -= 30;
          scores.restricted -= 20;
        }

        if (isSpecFixed) {
          scores.qualification += 25;
          scores.general += 20;
          scores.negotiation -= 30;
        } else {
          scores.negotiation += 30;
          scores.qualification -= 20;
          scores.twoStage += 20;
        }

        if (estimatedPrice >= 500000000) {
          scores.general += 20;
          scores.restricted += 15;
          scores.private -= 50;
        } else if (estimatedPrice <= 20000000) {
          scores.private += 60;
        }

        if (policyTarget !== 'none') {
          scores.restricted += 20;
          if (estimatedPrice <= 50000000) {
            scores.private += 40;
          }
        }

        if (isRebid) {
          scores.private += 70;
        }

        if (contractType === 'sw' || contractType === 'research') {
          scores.negotiation += 40;
          scores.qualification -= 10;
        }

        let best = 'general';
        let maxScore = -100;
        Object.keys(scores).forEach(key => {
          if (scores[key] > maxScore) {
            maxScore = scores[key];
            best = key;
          }
        });

        const labelMap = {
          general: "일반경쟁입찰",
          restricted: "제한경쟁입찰",
          negotiation: "협상에 의한 계약",
          qualification: "적격심사 낙찰제",
          twoStage: "규격·가격 동시입찰 (2단계)",
          private: "수의계약 체결"
        };

        return { scores, best, bestLabel: labelMap[best] };
      };

      const methodRecommendation = computeMethodScores();

      // C. 지체상금 시뮬레이션 계산
      const calculateDelayDamages = () => {
        let rate = 0.00075;
        let typeName = "물품 제조·구매";

        if (contractType === 'construction') {
          rate = 0.0005;
          typeName = "시설공사";
        } else if (contractType === 'service') {
          rate = 0.00125;
          typeName = "일반용역";
        } else if (contractType === 'sw') {
          rate = 0.00075;
          typeName = "소프트웨어 용역";
        } else if (contractType === 'research') {
          rate = 0.00125;
          typeName = "학술연구용역";
        }

        let baseAmount = estimatedPrice * 1.1;
        let targetDeductionAmount = isPartialDelivery ? partialAmount : 0;
        let actualBase = baseAmount - targetDeductionAmount;
        if (actualBase < 0) actualBase = 0;

        let dailyPenalty = Math.floor(actualBase * rate);
        let totalPenalty = dailyPenalty * delayDays;

        const maxPenalty = Math.floor(baseAmount * 0.3);
        const isCapped = totalPenalty > maxPenalty;
        const finalPenalty = isCapped ? maxPenalty : totalPenalty;

        const contractDeposit = Math.floor(baseAmount * 0.1);
        const dangerDaysLimit = dailyPenalty > 0 ? Math.ceil(contractDeposit / dailyPenalty) : 0;

        return {
          rate,
          typeName,
          baseAmount,
          actualBase,
          dailyPenalty,
          totalPenalty,
          finalPenalty,
          isCapped,
          maxPenalty,
          contractDeposit,
          dangerDaysLimit
        };
      };

      const delayDamages = calculateDelayDamages();

      // D. 계약 소요기간 및 간트 계산 (일상감사 기일 통상 일주일(7일) 고정)
      const calculateTimeline = () => {
        let phases = [
          { id: 'preReview', name: '발주계획 & 사전검토', days: 5, color: 'bg-indigo-100 border-indigo-300' },
          { id: 'rfpDraft', name: '과업지시서/RFP 확정', days: 7, color: 'bg-blue-100 border-blue-300' },
          { id: 'audit', name: '일상감사 (통상 일주일 소요)', days: 7, color: 'bg-teal-100 border-teal-300' },
          { id: 'notice', name: '입찰공고 기간', days: 40, color: 'bg-amber-100 border-amber-300' },
          { id: 'qa', name: '질의응답 및 정정공고', days: 5, color: 'bg-orange-100 border-orange-300' },
          { id: 'eval', name: '제안서 평가 및 가격개찰', days: 4, color: 'bg-pink-100 border-pink-300' },
          { id: 'negotiation', name: '우선협상 진행', days: 10, color: 'bg-purple-100 border-purple-300' },
          { id: 'signing', name: '계약체결 및 승인', days: 5, color: 'bg-emerald-100 border-emerald-300' }
        ];

        if (isUrgent) {
          const noticePhase = phases.find(p => p.id === 'notice');
          if (noticePhase) noticePhase.days = 10;
        } else {
          if (methodRecommendation.best !== 'negotiation' && estimatedPrice < 200000000) {
            const noticePhase = phases.find(p => p.id === 'notice');
            if (noticePhase) noticePhase.days = 7;
          }
        }

        if (methodRecommendation.best === 'private' || pContractEval.isFeasible) {
          phases = [
            { id: 'preReview', name: '발주요청', days: 2, color: 'bg-indigo-100 border-indigo-300' },
            { id: 'rfpDraft', name: '과업내용서 확정', days: 3, color: 'bg-blue-100 border-blue-300' },
            { id: 'audit', name: '일상감사 (통상 일주일 소요)', days: 7, color: 'bg-teal-100 border-teal-300' },
            { id: 'notice', name: '견적제출공고 (또는 생략)', days: 3, color: 'bg-amber-100 border-amber-300' },
            { id: 'signing', name: '수의계약 체결', days: 2, color: 'bg-emerald-100 border-emerald-300' }
          ];
        }

        const totalDays = phases.reduce((acc, p) => acc + p.days, 0);
        const oneRebidDays = totalDays + 15;
        const twoRebidDays = totalDays + 30;

        const targetDate = new Date(targetDateStr);
        const startCalculatedDate = new Date(targetDate);
        startCalculatedDate.setDate(targetDate.getDate() - totalDays);

        return {
          phases,
          totalDays,
          oneRebidDays,
          twoRebidDays,
          startCalculatedDateStr: startCalculatedDate.toISOString().split('T')[0]
        };
      };

      const timelineSim = calculateTimeline();

      // E. 감사 및 감점 지적 리스크 레벨링
      const getAuditRiskLevel = () => {
        let score = 0;
        let indicators = [];

        if (estimatedPrice >= 18000000 && estimatedPrice < 20000000) {
          score += 35;
          indicators.push({
            title: "소액수의 우회(쪼개기) 의심",

            severity: "high"
          });
        }

        if (isSingleSource && !hasPatent) {
          score += 20;
          indicators.push({
            title: "독점권 입증 문서 취약",

            severity: "medium"
          });
        }

        if (hasPatent && methodRecommendation.best !== 'private') {
          score += 15;
          indicators.push({
            title: "특정 규격 포함 입찰장벽",
            desc: "입찰공고 과업지시서에 특정 업체의 특허 기술을 필수 조건으로 명시하면 경쟁제한 요소로 민원이 발생할 수 있습니다.",
            severity: "medium"
          });
        }

        const currentMonth = new Date().getMonth() + 1;
        if (currentMonth >= 10 && timelineSim.totalDays > 40) {
          score += 30;
          indicators.push({
            title: "회계연도 말 예산 불용 위험",
            desc: "현재 시점은 4분기로, 긴 공기 소요에 따른 사고이월 혹은 불용 처리가 우려되므로 계약 방식을 더 신속한 형태로 전환 권장합니다.",

            severity: "low"

        return { score, status, color, indicators };

      const auditRisk = getAuditRiskLevel();

          contractMethods.push("제한경쟁입찰 적격심사 시 신인도 가산점 우대 및 조달청 벤처나라 전용 등록 가능");

          contractMethods.push("추정가격 기준에 따라 일반경쟁입찰 또는 제한경쟁입찰 원칙 적용");
          credits.push("법정 정책구매 우대 실적 가산 없음");
        }

        return { companies, contractMethods, credits };
      };

      const policyEvalResult = getDynamicPolicyResults();

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans antialiased">
          {/* HEADER SECTION */}
          <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 py-5 px-6">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div>
                <div className="flex items-center gap-2">
                  <span className="px-2 py-1 text-xs font-bold uppercase bg-indigo-500 text-white rounded">v3.0 Stable (HTML)</span>
                  <h1 className="text-2xl font-black tracking-tight text-white">계약 의사결정 지원 시스템</h1>
                </div>
                <p className="text-sm text-slate-400 mt-1">발주 전 계약방식 추천, 법적 근거, 감사위험 진단, 일정 간트 및 지체상금을 한 번에 진단하는 의사결정 지원 시스템</p>
              </div>
              <div className="flex flex-wrap gap-2 items-center">
                <span className="text-xs text-slate-400 mr-1 font-semibold">시나리오 빠른 프리셋:</span>
                {PRESETS.map((p, idx) => (
                  <button
                    key={idx}

발신: 계약담당 공무원 / 발주기관장

귀사와의 계약 건에 대하여 아래와 같이 지체상금 부과 대상 및 처분 예정을 통지하오니, 이의가 있을 시 명시된 기한까지 귀책사유 면책에 대한 증빙을 포함하여 소명 자료를 제출하시기 바랍니다.

  - 최종 부과 예정 금액: ${delayDamages.finalPenalty.toLocaleString()} 원`, 'noticeDraft')}

                        </button>

수신: ${companyName} 대표이사
발신: 계약담당 공무원 / 발주기관장

귀사와의 계약 건에 대하여 아래와 같이 지체상금 부과 대상 및 처분 예정을 통지하오니 귀책사유 면책에 관한 증빙을 제출하시길 바랍니다...`}
                      </pre>
                    </div>
                  </div>

                            <input 
                              type="checkbox" 
                              checked={!!checkedItems[item.id]}

                          </label>

                          {/* 우수조달보유여부 */}

                            <input

                              checked={policyStates.excellent}

                            />

                          </label>

                          {/* 직접생산확인여부 */}
                          <label className="flex items-center gap-1.5 p-2 bg-white border rounded text-xs select-none cursor-pointer hover:bg-slate-50">
                            <input 
                              type="checkbox" 
                              checked={policyStates.directProd}

                              checked={policyStates.masReg} 
                              onChange={(e) => setPolicyStates(prev => ({ ...prev, masReg: e.target.checked }))} 
                            />

                          </label>

                        </div>
                      </div>

                      {/* 구체화된 정책 조달 분석 판정서 */}
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        
                        <div className="p-3.5 bg-indigo-50 border border-indigo-100 rounded-lg">
                          <span className="text-[10px] text-indigo-700 font-bold block mb-1.5 uppercase tracking-wider">■ 가능 업체 유형</span>

                        </div>

                        <div className="p-3.5 bg-amber-50 border border-amber-100 rounded-lg">

                          <div className="space-y-1 text-xs text-slate-800 font-medium">

                        <div className="p-3.5 bg-emerald-50 border border-emerald-100 rounded-lg">
                          <span className="text-[10px] text-emerald-700 font-bold block mb-1.5 uppercase tracking-wider">■ 기관 실적 인정</span>
                          <div className="space-y-1 text-xs text-slate-800 font-medium">
                            {policyEvalResult.credits.map((cr, i) => (
                              <div key={i}>• {cr}</div>

                        </div>

                      </div>

                    </div>
                  </div>
                )}

              </div>
            </section>

          </main>

          {/* FOOTER METADATA */}

            <div className="max-w-7xl mx-auto px-4">
              <p>© 2026 사전 계약 시뮬레이터. 대한민국 국가계약법·시행령·시행규칙 및 계약예규 기준 엔진 구동 중.</p>
              <p className="mt-1 text-slate-600">※ 본 프로그램은 의사결정 참고용 시뮬레이션이며, 실제 발주 집행 시 소관 부처 상급기관 감사과 및 조달청의 최종 유권해석을 우선시합니다.</p>
            </div>
          </footer>
        </div>
      );
    }

    // React Render 트리거
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
