<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>조팸스런 — 바로가기</title>
<meta name="description" content="조팸스런: 공공구매 대작전 — 기기에 맞는 페이지로 자동 연결됩니다." />

<!--
  =====================================================================
  조팸스런 분기 페이지 (Smart Redirect / Landing Page)
  ---------------------------------------------------------------------
  역할
    1) 접속 기기를 판별합니다 (Android / iOS / 그 외 PC 등)
    2) Android  → Google Play 스토어 앱 페이지로 자동 이동
       https://play.google.com/store/apps/details?id=com.jofams.game
    3) iOS(iPhone/iPad) → 웹 버전(localpay)으로 자동 이동
       https://localpay.github.io/localpay/
    4) 판별이 애매하거나(PC 등) 자동이동이 차단된 경우
       두 버튼을 모두 보여주고 사용자가 직접 선택하게 합니다.

  배포 방법
    - 이 파일 하나만 있으면 됩니다 (외부 의존성 없음, 폰트/아이콘 전부 인라인).
    - GitHub Pages, Netlify, S3 정적 호스팅 등 아무 곳에나 index.html로
      올리면 바로 동작합니다. (예: localpay 프로젝트와 동일한 방식)
    - QR코드는 이 페이지의 배포 URL 하나로 만들면, Android/iOS 상관없이
      QR 하나로 통일할 수 있습니다.
  =====================================================================
-->

<style>
  :root{
    --navy: #12142B;
    --card: #1D2148;
    --card-2: #222758;
    --lime: #B9FF3D;
    --purple: #8B6BFF;
    --white: #FFFFFF;
    --mute: #AEB2D6;
    --mute-2: #7B7FA6;
    --radius: 20px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
                 "Apple SD Gothic Neo", Roboto, sans-serif;
    min-height: 100%;
  }

  /* soft ambient glows, purely decorative */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 46vh; height: 46vh;
    top: -18vh; right: -14vh;
    background: radial-gradient(circle, rgba(139,107,255,0.16), transparent 70%);
  }
  body::after {
    width: 40vh; height: 40vh;
    bottom: -16vh; left: -14vh;
    background: radial-gradient(circle, rgba(185,255,61,0.12), transparent 70%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    text-align: center;
  }

  .eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--lime);
    margin-bottom: 14px;
  }

  h1 {
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--mute); font-weight: 500; }

  .sub {
    color: var(--mute);
    font-size: 15px;
    margin: 0 0 34px;
    max-width: 360px;
    line-height: 1.5;
  }

  /* ---- auto-redirect status ---- */
  #status {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 14px;
    color: var(--mute);
    margin-bottom: 28px;
  }
  .spinner {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(174,178,214,0.25);
    border-top-color: var(--lime);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- manual choice cards ---- */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 340px;
  }

  .choice {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 16px 18px;
    text-decoration: none;
    color: var(--white);
    text-align: left;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .choice:active { transform: scale(0.98); }
  .choice:hover { background: var(--card-2); }

  .choice .icon {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .choice.android .icon { background: rgba(185,255,61,0.15); color: var(--lime); }
  .choice.ios .icon { background: rgba(139,107,255,0.18); color: var(--purple); }

  .choice .label { flex: 1; }
  .choice .label .t1 {
    font-size: 15px; font-weight: 700; margin-bottom: 2px;
  }
  .choice .label .t2 {
    font-size: 12.5px; color: var(--mute-2);
  }
  .choice .chevron { color: var(--mute-2); font-size: 18px; }

  .badge-recommend {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: var(--lime);
    color: var(--navy);
    padding: 3px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }

  footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--mute-2);
  }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; border-top-color: var(--lime); }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">JOPAMS PLAY GROUND</div>
  <h1>조팸스런 <span>바로가기</span></h1>
  <p class="sub">접속하신 기기에 맞는 페이지로<br />자동으로 연결해 드릴게요.</p>

  <!-- 자동 이동 진행 상태 (판별 성공 시에만 노출) -->
  <div id="status" class="hidden">
    <span class="spinner" aria-hidden="true"></span>
    <span id="statusText">이동 중입니다…</span>
  </div>

  <!-- 수동 선택 카드 (자동 이동 실패/미판별 시, 혹은 항상 대체 수단으로 노출) -->
  <div class="choices">
    <a class="choice android" id="androidLink"
       href="https://play.google.com/store/apps/details?id=com.jofams.game">
      <span class="icon">▶</span>
      <span class="label">
        <span class="t1">안드로이드로 열기<span id="androidBadge" class="badge-recommend hidden">추천</span></span>
        <span class="t2">Google Play 스토어에서 설치</span>
      </span>
      <span class="chevron">›</span>
    </a>

    <a class="choice ios" id="iosLink"
       href="https://localpay.github.io/localpay/">
      <span class="icon"></span>
      <span class="label">
        <span class="t1">아이폰으로 열기<span id="iosBadge" class="badge-recommend hidden">추천</span></span>
        <span class="t2">웹에서 설치 없이 바로 플레이</span>
      </span>
      <span class="chevron">›</span>
    </a>
  </div>

  <footer>한국조폐공사 · 조팸스런: 공공구매 대작전</footer>
</div>

<script>
(function () {
  "use strict";

  // ---- 목적지 URL (한 곳만 수정하면 전체 반영됩니다) ----
  var URLS = {
    android: "https://play.google.com/store/apps/details?id=com.jofams.game",
    ios: "https://localpay.github.io/localpay/"
  };

  // ---- 자동 이동까지 대기 시간(ms). 너무 빠르면 화면을 못 읽고,
  //      너무 느리면 답답하므로 900ms 정도가 적당합니다. ----
  var REDIRECT_DELAY = 900;

  var ua = navigator.userAgent || navigator.vendor || window.opera || "";

  function isAndroid() {
    return /android/i.test(ua);
  }

  function isIOS() {
    // 표준 iPhone/iPad/iPod UA 판별
    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return true;
    // iPadOS 13+ 는 데스크톱 Safari로 위장하므로 터치 지원 여부로 추가 판별
    if (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) return true;
    return false;
  }

  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var androidBadge = document.getElementById("androidBadge");
  var iosBadge = document.getElementById("iosBadge");

  var target = null;
  var platformLabel = "";

  if (isAndroid()) {
    target = URLS.android;
    platformLabel = "Google Play 스토어";
    androidBadge.classList.remove("hidden");
  } else if (isIOS()) {
    target = URLS.ios;
    platformLabel = "웹 플레이 페이지";
    iosBadge.classList.remove("hidden");
  }

  if (target) {
    // 자동 이동 판별에 성공한 경우: 상태 UI를 보여주고 잠시 후 이동합니다.
    // 아래 두 버튼은 자동 이동이 실패(팝업 차단 등)했을 때의 대체 수단으로 항상 남겨둡니다.
    statusText.textContent = platformLabel + "로 이동 중입니다…";
    statusEl.classList.remove("hidden");

    window.setTimeout(function () {
      window.location.replace(target);
    }, REDIRECT_DELAY);
  }
  // target이 null이면(PC 등 판별 불가) 자동 이동 없이 두 버튼만 노출된 상태로 둡니다.
})();
</script>

</body>
</html>
